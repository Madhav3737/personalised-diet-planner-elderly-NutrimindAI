version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nutrimind_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nutrimind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: nutrimind_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/nutrimind
      - USE_SQLITE_FALLBACK=False
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=gpt-4o
      - SECRET_KEY=supersecretkeychangeit48920384029384
    depends_on:
      - db
    volumes:
      - ./backend/documents:/app/documents
      - ./backend/embeddings:/app/embeddings

  frontend:
    build: ./frontend
    container_name: nutrimind_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
